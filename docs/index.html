<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정책·경제 일정</title>
<meta name="description" content="한국은행·통계청·국회 등 국내 주요 정책과 경제지표 발표 일정을 한 화면에 모아 봅니다.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">

  <header class="masthead">
    <h1 class="wordmark">정책·경제 일정 <span>대한민국</span></h1>
    <div class="stamp">
      마지막 갱신 <b id="stamp-updated">불러오는 중</b><br>
      수록 <b id="stamp-count">–</b>건 · 소스 <b id="stamp-sources">–</b>개
    </div>
  </header>

  <!-- 시그니처: 오늘을 기준으로 앞뒤 일정을 한 줄 눈금에 펼친 레일 -->
  <section class="rail" id="rail" aria-label="향후 일정 개요">
    <span class="rail-caption">-30일 &nbsp;—&nbsp; +90일</span>
    <div class="rail-baseline"></div>
  </section>

  <div class="controls">
    <div class="month-nav">
      <button id="prev" aria-label="이전 달">‹</button>
      <span class="month-label" id="month-label">–</span>
      <button id="next" aria-label="다음 달">›</button>
      <button id="today" class="ghost">오늘</button>
    </div>
    <input type="search" id="q" placeholder="이벤트·기관 검색">
    <select id="importance">
      <option value="0">중요도 전체</option>
      <option value="3">★★★ 만</option>
      <option value="2">★★ 이상</option>
    </select>
    <label class="chip" id="hide-cancelled-wrap">
      <input type="checkbox" id="hide-cancelled" checked style="margin:0"> 취소 숨기기
    </label>
    <span class="spacer"></span>
    <button id="export-ics" class="ghost">캘린더 구독용 .ics</button>
    <button id="export-csv" class="ghost">CSV</button>
  </div>

  <div class="chips" id="chips" role="group" aria-label="카테고리 필터"></div>

  <div class="grid" id="grid" role="grid" aria-label="월간 달력"></div>

  <div class="table-head">
    <h2>이벤트 목록</h2>
    <span class="count" id="table-count"></span>
  </div>
  <div id="table-wrap"></div>

  <footer>
    <p id="foot-note">
      일정은 각 기관 발표를 모은 것이며 변경될 수 있습니다. 실제 결정에 쓰기 전에 반드시 원문 링크로 확인하세요.
      추정으로 표시된 일정은 공표 주기로 계산한 값이라 실제와 다를 수 있습니다.
    </p>
  </footer>
</div>

<aside class="drawer" id="drawer" data-open="false" aria-live="polite">
  <button class="close" id="drawer-close" aria-label="닫기">×</button>
  <div id="drawer-body"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
